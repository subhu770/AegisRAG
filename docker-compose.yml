version: "3.9"

services:
  aegis-rag:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aegisrag-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - AEGIS_PROJECT_NAME=AegisRAG
      - AEGIS_DEBUG=false
      - AEGIS_LOG_LEVEL=INFO
      - AEGIS_EMBEDDING_MODEL_NAME=sentence-transformers/all-MiniLM-L6-v2
      - AEGIS_RERANKER_MODEL_NAME=cross-encoder/ms-marco-MiniLM-L-6-v2
      - AEGIS_VECTOR_STORE_TYPE=chroma
      - AEGIS_CHROMA_PERSIST_DIRECTORY=/app/data/chroma_db
      - AEGIS_CHROMA_COLLECTION_NAME=aegis_enterprise_knowledge
      - AEGIS_GENERATOR_PROVIDER=local_synthesis
      - TORCH_HOME=/home/aegisuser/.cache/torch
      - HF_HOME=/home/aegisuser/.cache/huggingface
    volumes:
      - ./data/chroma_db:/app/data/chroma_db
      - aegis-model-cache:/home/aegisuser/.cache
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 8G
        reservations:
          cpus: "1.0"
          memory: 2G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

volumes:
  aegis-model-cache:
    driver: local

